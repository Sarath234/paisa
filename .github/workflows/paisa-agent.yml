name: Paisa Agent Release

on:
  push:
    branches:
      - feat/ingestion-agent
    tags:
      - '*'

permissions:
  contents: write

jobs:
  paisa-agent:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-amd64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-amd64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-amd64
            ext: .exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.2'

      - name: Build paisa-agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -o paisa-agent-${{ matrix.suffix }}${{ matrix.ext }} ./cmd/paisa-agent/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: paisa-agent-${{ matrix.suffix }}
          path: paisa-agent-${{ matrix.suffix }}${{ matrix.ext }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: paisa-agent-${{ matrix.suffix }}${{ matrix.ext }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
