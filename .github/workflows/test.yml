name: Test

on:
  - push
  - pull_request

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2.4.0
    - uses: nixbuild/nix-quick-install-action@v30
    - uses: nix-community/cache-nix-action@v6
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}
    - run: nix develop --command npm install
    - run: nix develop --command make lint
    - run: nix develop --command bash -c 'npm run build && make regen'
    - name: Upload regenerated fixtures
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: fixtures
        path: tests/fixture/
    - name: Verify fixtures are up to date
      run: git diff --exit-code tests/fixture/
    - run: nix develop --command bash -c 'bun test --preload ./src/happydom.ts src && npm run build && go test ./...'
